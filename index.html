<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programador Java</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid #1e293b;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            background-color: #10b981;
            border: 2px solid #0b0f19;
            border-radius: 50%;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .title {
            font-size: 0.95rem;
            color: #00f2fe;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .bio {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tag {
            background: rgba(0, 242, 254, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #00f2fe;
            color: #0b0f19;
            border: none;
        }

        .btn-primary:hover {
            background: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background: #1e293b;
            border-color: #475569;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <!-- Reemplaza la URL de abajo por la ruta local de tu imagen si la descargas -->
            <img class="avatar-img" src="lince.jpg" alt="Avatar Lince Programador">
            <span class="status-badge" title="Disponible para proyectos"></span>
        </div>

        <h1 class="name">OmarGlz777</h1>
        <p class="title">Developer Backend</p>
        
        <p class="bio">
            Especialista en desarrollo backend con Spring Boot
        </p>

        <div class="tags">
            <span class="tag">Java / Spring</span>
            <span class="tag">Oracle</span>
        </div>

        <div class="actions">
            <a href="https://github.com/OmarGlz777" target="_blank" class="btn btn-primary">GitHub</a>
            <a href="#" class="btn btn-secondary">Contacto</a>
        </div>
    </div>

</body>
</html>
